# agtx sandbox — the container definition. Launch with sandbox.sh, or directly:
#   PROJECT=/path/to/project <runtime> compose -f compose.yaml up
#
# State is isolated in a named volume; host agent settings are staged read-only
# and copied in at startup by entrypoint.sh (never written back to the host).
# Networking is bridge by default; sandbox.sh sets SANDBOX_NET_MODE=host on
# Linux so the sandbox can reach a locally-hosted model (e.g. Ollama).
#
# Customize: copy to compose.custom.yaml (gitignored) and edit it.
# Rootless Podman: compose.keepid.yaml is added automatically.

services:
  sandbox:
    image: agtx-sandbox
    build:
      context: .
      args:
        # Host UID/GID so bind-mounted files come out owned by the host user.
        UID: ${AGTX_BUILD_UID:-1000}
        GID: ${AGTX_BUILD_GID:-1000}
    # Fixed name: lets sandbox.sh read the exit code via `<runtime> inspect`.
    container_name: agtx-sandbox
    # Unprivileged; DAC_OVERRIDE (below) lets the entrypoint read the host's
    # own 700 config to stage a copy.
    user: sandbox
    working_dir: /home/sandbox/workspace
    command: ["agtx", "/home/sandbox/workspace"]
    # TUI needs a live TTY and stdin
    stdin_open: true
    tty: true
    # bridge by default; host (Linux) so the sandbox reaches host services
    network_mode: ${SANDBOX_NET_MODE:-bridge}
    environment:
      # sandbox: entrypoint pre-configures a disposable config copy.
      # runtime (compose.runtime.yaml): leave the host's real config alone.
      - AGTX_MODE=sandbox
      # host or bridge; entrypoint uses it to adapt local-model configs
      - SANDBOX_NET_MODE=${SANDBOX_NET_MODE:-bridge}
    # Least privilege
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      # The project, writable — the only host path the agent can touch
      - ${PROJECT}:/home/sandbox/workspace
      # agtx state persists here; host settings are staged ro below, copied in
      # at startup, so this volume never sees the host's state
      - agtx-data:/home/sandbox/.config/agtx
      # Host agent settings, staged ro and copied in at startup (never written
      # back). sandbox.sh pre-creates any absent ones; empty ones no-op.
      - ${HOME}/.claude:/claude-host:ro
      - ${HOME}/.claude.json:/claude-host.json:ro
      - ${HOME}/.config/agtx/config.toml:/agtx-host-config.toml:ro
      - ${HOME}/.config/agtx/plugins:/agtx-host-plugins:ro
      - ${HOME}/.config/opencode:/opencode-host:ro
    # Optional (off by default):
    #   ports:
    #     - "3000:3000"            # not compatible with network_mode: host
    #   restart: unless-stopped
    # Prebuilt image instead of the local build: change image:, drop build:.
    # Extra env: append to the environment: list.
    # Local models: set SANDBOX_NET_MODE=host (sandbox.sh does this on Linux).

volumes:
  # Top-level so the bind above is a named volume, not a literal "agtx-data" dir
  agtx-data:
