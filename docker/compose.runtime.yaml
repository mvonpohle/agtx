# agtx runtime mode — the container as agtx's runtime, not a sandbox.
# Opposite of the sandbox's isolation: the host's real config and state
# (agtx, Claude, OpenCode) are mounted WRITABLE at their normal locations, so
# agtx writes config/status/updates straight to the host. It's the in-container
# equivalent of installing agtx — another way to run it, not a jail. Still a
# container with the same least-privilege caps.
#
# Customize: copy to compose.custom.yaml (gitignored) and edit it.
#
# Launch directly:
#   PROJECT=/path/to/project PROJECT_NAME=$(basename /path/to/project) \
#       docker compose -f compose.runtime.yaml up
# or via the launcher:
#   AGTX_RUNTIME=1 ./docker/sandbox.sh path/to/your-project

services:
  sandbox:
    image: agtx-sandbox
    build:
      context: .
      args:
        # Host UID/GID so bind-mounted files come out owned by the host user.
        UID: ${AGTX_BUILD_UID:-1000}
        GID: ${AGTX_BUILD_GID:-1000}
    # Fixed name (distinct from the sandbox) so inspect/stop address the right one.
    container_name: agtx-runtime
    user: sandbox
    # Mounted under the project's own name so agtx derives the real project
    # name (and path-keyed DB) instead of the generic "workspace".
    working_dir: /home/sandbox/workspaces/${PROJECT_NAME:-workspace}
    command: ["agtx", "/home/sandbox/workspaces/${PROJECT_NAME:-workspace}"]
    # TUI needs a live TTY and stdin
    stdin_open: true
    tty: true
    environment:
      # entrypoint leaves the host's real config untouched (no sandbox staging)
      - AGTX_MODE=runtime
    # Same least-privilege caps as the sandbox
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      # The project, writable; mounted under its own name so the board shows the
      # real project and each gets its own path-keyed database
      - ${PROJECT}:/home/sandbox/workspaces/${PROJECT_NAME:-workspace}
      # Real agtx config AND state, WRITABLE (config.toml, plugins/, trust store,
      # project DBs) — this is what "writes back to the host" means
      - ${HOME}/.config/agtx:/home/sandbox/.config/agtx
      # Real OpenCode config, WRITABLE (provider + model selection)
      - ${HOME}/.config/opencode:/home/sandbox/.config/opencode
      # Real Claude config/credentials, WRITABLE
      - ${HOME}/.claude:/home/sandbox/.claude
      # Real Claude onboarding/trust file, WRITABLE
      - ${HOME}/.claude.json:/home/sandbox/.claude.json
    # Optional (off by default):
    #   ports:
    #     - "3000:3000"
    #   restart: unless-stopped
    # Prebuilt image instead of the local build: change image:, drop build:.
    # Extra env: append to the environment: list.
