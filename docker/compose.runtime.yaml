# agtx runtime — the container as agtx's host (portable install), not a sandbox.
#
# The sandbox (compose.yaml) isolates agtx's state in a named volume and stages
# your host settings read-only, so nothing the agent does can reach the host.
# Runtime mode is the opposite of that isolation: it mounts your host's real
# config and state — agtx, Claude, and OpenCode — WRITABLE at their normal
# locations, so agtx behaves like a local install. It is the in-container
# equivalent of installing agtx on a machine that lacks the dependencies to run
# it natively — another way to run agtx, not a jail. Same least-privilege caps.
#
# The thin launcher (docker/runtime.sh) pre-creates any of the host paths mounted
# below that do not yet exist (as your host user), so a bind mount never
# auto-creates a root-owned directory on the host.
#
# Launch (recommended — it attaches the TUI's stdin and computes WORKSPACE_MOUNT):
#
#   ./docker/runtime.sh path/to/your-project
#
# Customize (see docker/.env.example):
#   * docker/.env             — PROJECTS_DIR, AGTX_HOST_NETWORK, ... (values)
#   * COMPOSE_OVERRIDE=<file> — an extra compose file (mounts/env/caps)
#   * this file               — the base definition, edited directly
#
# The project (or its shared root) is mounted under /home/sandbox/workspaces so
# agtx derives the real project name. agtx silently skips a project whose path is
# absent, so in the container only mounted projects are reachable in the sidebar.
# Set PROJECTS_DIR to the directory that CONTAINS your projects and every one of
# them becomes switchable at once; leave it unset to mount only the launched one.
#
# A direct compose launch is possible but must set WORKSPACE_MOUNT itself (the
# launcher normally computes it) and will not attach the TUI's stdin:
#
#   WORKSPACE_MOUNT=/path/to/project:/home/sandbox/workspaces/project \
#       docker compose -f compose.runtime.yaml up

services:
  sandbox:
    image: agtx-sandbox
    build:
      context: .
      args:
        # Host UID/GID so bind-mounted files come out owned by the host user.
        UID: ${AGTX_BUILD_UID:-1000}
        GID: ${AGTX_BUILD_GID:-1000}
    # Fixed name: lets sandbox.sh read the container's exit code via
    # `<runtime> inspect` (Podman's `compose up` reports 0 regardless). Runtime
    # mode is not a jail, so it gets its own name to tell its container apart
    # from the sandbox (compose.yaml) when both are on the host.
    container_name: agtx-runtime
    user: sandbox
    # Mounted under the project's own directory name, not the sandbox's generic
    # "workspace": agtx derives the project name (and its path-keyed project DB)
    # from this basename, so the board reflects the real project. PROJECT_NAME is
    # exported by sandbox.sh; the fallback covers a direct compose launch.
    working_dir: /home/sandbox/workspaces/${PROJECT_NAME:-workspace}
    command: ["agtx", "/home/sandbox/workspaces/${PROJECT_NAME:-workspace}"]
    # TUI: needs a live TTY and stdin.
    stdin_open: true
    tty: true
    environment:
      # Tells the entrypoint to leave your real config untouched and let agtx
      # and Claude behave like a normal local run (no sandbox pre-configuration).
      - AGTX_MODE=runtime
      # The container's home is /home/sandbox (WORKDIR and every mount). As uid 0
      # (rootless Podman, via compose.keepid.yaml) the runtime would set HOME=/root,
      # sending agtx's config to /root/.config/agtx (the overlay) instead of the
      # mounted host config. Pin it to the real home so it holds for any uid.
      - HOME=/home/sandbox
    # bridge by default; the launchers set SANDBOX_NET_MODE=host (on Linux) so the
    # runtime container reaches the host's own services — what a locally-hosted
    # model (e.g. Ollama on localhost) needs. See the networking note in the header.
    network_mode: ${SANDBOX_NET_MODE:-bridge}
    # Same least-privilege caps as the sandbox — it is still a container.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      # The project (or its shared root), writable — the path agtx works on. By
      # default the launched project is mounted under its own name so the board
      # shows the real project and each project gets its own path-keyed database.
      #
      # Set PROJECTS_DIR (see docker/.env) to the directory that CONTAINS the
      # project and its siblings, and it is mounted at /home/sandbox/workspaces
      # instead. agtx silently skips a project whose path is absent, so without
      # this only the launched project would be reachable in the sidebar; with
      # it, every project in that root is reachable at /home/sandbox/workspaces/<name>.
      #
      # WORKSPACE_MOUNT is computed by sandbox.sh as "source:target" from PROJECT
      # (and PROJECTS_DIR when set); podman-compose's substitution breaks on
      # nested ${VAR:-default}, so the compose file keeps it to one flat value.
      # Quoted so the ": " inside the error message does not make YAML parse the
      # line as a mapping instead of a string.
      - "${WORKSPACE_MOUNT:?use ./docker/sandbox.sh — it sets WORKSPACE_MOUNT from PROJECT and PROJECTS_DIR}"
      # Your real agtx config AND state, WRITABLE, at the normal location. This
      # is what "writes config/status/updates back to the host" means: config.toml,
      # plugins/, the trust store, and the project databases all live here.
      - ${HOME}/.config/agtx:/home/sandbox/.config/agtx
      # Your real OpenCode global config (provider + model selection), WRITABLE,
      # at the normal location. Without this OpenCode starts with a fresh empty
      # config and opens on a "no provider" state.
      - ${HOME}/.config/opencode:/home/sandbox/.config/opencode
      # Your real Claude config and credentials, WRITABLE, at the normal location.
      - ${HOME}/.claude:/home/sandbox/.claude
      # Your real Claude onboarding/trust file, WRITABLE.
      - ${HOME}/.claude.json:/home/sandbox/.claude.json
    # --- Optional settings (off by default). ---
    # Expose a container port on the host (none are needed for the TUI):
    #   ports:
    #     - "3000:3000"
    # Set a restart policy:
    #   restart: unless-stopped
    # To use a prebuilt image instead of the local Dockerfile, change the
    # image: value above (and drop the build: block).
    # To add an environment variable, append it to the environment: list above.
